<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><style>body{font:16px Arial;background:#f3f6fb;color:#17233b}.wrap{max-width:700px;margin:30px auto}.card{background:white;padding:22px;border-radius:12px}input,select,button{display:block;padding:10px;margin:10px 0;width:95%}</style><main class="wrap"><a href="/dashboard">Dashboard</a><h1>Profile and preferences</h1><section class="card">{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" maxlength="100" required value="{{ user['name'] }}"></label><label>Email<input name="email" type="email" maxlength="254" required value="{{ user['email'] }}"></label><label>Preferred transport<select name="preferred_transport"><option value="">No preference</option>{% for mode in ['Bus','Train','Car'] %}<option {% if user['preferred_transport']==mode %}selected{% endif %}>{{ mode }}</option>{% endfor %}</select></label><label>Default budget<input name="default_budget" type="number" min="0" step="0.01" value="{{ user['default_budget'] or '' }}"></label><label>Theme<select name="theme"><option value="light" {% if user['theme']=='light' %}selected{% endif %}>Light</option><option value="dark" {% if user['theme']=='dark' %}selected{% endif %}>Dark</option></select></label><label>Profile image (PNG/JPEG/WEBP, max 2 MB)<input type="file" name="profile_image" accept="image/png,image/jpeg,image/webp"></label>{% if user['profile_image'] %}<p><img src="{{ url_for('static',filename='uploads/profiles/'+user['profile_image']) }}" alt="Profile image" width="96" height="96"></p>{% endif %}<label>Currency code<input name="currency" maxlength="3" value="{{ user['currency'] }}"></label><label>Current password (required only when changing password)<input name="current_password" type="password"></label><label>New password (leave blank to keep current)<input name="new_password" type="password" minlength="8"></label><button>Save profile</button></form></section></main></html>
