<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity logs</title><style>body{font:15px Arial;background:#f3f6fb;color:#17233b}.wrap{max-width:1100px;margin:25px auto}.card{background:white;padding:20px;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd}</style><main class="wrap"><a href="/admin">Admin</a><h1>Recent activity</h1><section class="card"><table><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr>{% for item in logs %}<tr><td>{{ item['created_at'] }}</td><td>{{ item['email'] or 'System' }}</td><td>{{ item['action'] }}</td><td>{{ item['details'] }}</td></tr>{% else %}<tr><td colspan="4">No activity logged.</td></tr>{% endfor %}</table></section></main></html>
