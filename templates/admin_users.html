<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage users</title><style>body{font:15px Arial;background:#f3f6fb;color:#17233b}.wrap{max-width:1000px;margin:25px auto}.card{background:white;padding:20px;border-radius:12px;margin:14px 0}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd}</style><main class="wrap"><a href="/admin">Admin</a><h1>User management</h1><section class="card"><form><input name="q" value="{{ query }}" placeholder="Search name/email"><button>Search</button></form><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>{% for user in users %}<tr><td>{{ user['name'] }}</td><td>{{ user['email'] }}</td><td>{{ user['role'] }}</td><td>{{ 'Active' if user['is_active'] else 'Inactive' }}</td><td>{% if user['role']=='USER' %}<form method="post" action="{{ url_for('admin_toggle_user',user_id=user['id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>{{ 'Deactivate' if user['is_active'] else 'Activate' }}</button></form><form method="post" action="{{ url_for('admin_delete_user',user_id=user['id']) }}" onsubmit="return confirm('Permanently delete this user and their trips and expenses?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Delete user</button></form>{% endif %}</td></tr>{% endfor %}</table></section></main></html>
