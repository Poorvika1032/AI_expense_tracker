<!DOCTYPE html>
<html data-theme="{{ session.get('theme', 'light') }}">
<head><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}">
    <title>AI Insights</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
        }

        .header {
            background: #4a6cf7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .insight {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #4a6cf7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI Travel Expense Tracker</h1>
        <p>AI Insights</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>🤖 History-based Spending Insight (rule-based)</h2>

            <p>
                Your average predicted trip cost is:
            </p>

            <h2>₹{{ average_expense }}</h2>

            <p>Average duration: {{ average_days }} days &middot; Most selected transport: {{ preferred_transport }}</p><div class="insight">
                💡 {{ message }}
            </div>

            <a href="/dashboard" class="button">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
