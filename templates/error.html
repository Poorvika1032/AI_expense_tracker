<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Error {{ code }}</title><style>body{font:16px Arial;background:#f3f6fb;color:#17233b}.card{max-width:650px;margin:15vh auto;background:white;padding:32px;border-radius:14px;text-align:center}a{color:#315ce8}</style><main class="card"><h1>{{ code }}</h1><p>{{ message }}</p><a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">Continue</a></main></html>
