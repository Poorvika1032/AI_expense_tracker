<!doctype html>
<html lang="en" data-theme="{{ session.get('theme','light') }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Wayfare</title><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"></head>
<body class="auth-page">
  <section class="auth-hero" aria-label="Travel planning"><div class="hero-copy fade-up"><div class="brand"><span class="brand-mark" aria-hidden="true">⌖</span> WAYFARE</div><h1>Make room<br>for the journey.</h1><p>Plan trips around real estimates, keep your budget in view, and learn from every journey.</p></div></section>
  <main class="auth-form-wrap"><section class="auth-card fade-up">
    <div class="eyebrow">Start exploring</div><h2>Create your account</h2><p class="muted">A smarter travel budget begins here.</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form action="{{ url_for('register') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="auth-fields">
      <div><label for="name">Your name</label><input id="name" type="text" name="name" autocomplete="name" maxlength="100" required placeholder="Name"></div>
      <div><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
    </div><button type="submit">Create account <span aria-hidden="true">→</span></button></form>
    <p class="muted" style="text-align:center;margin:22px 0 0">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </section></main>
</body></html>
