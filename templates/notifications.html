<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><style>body{font:16px Arial;background:#f3f6fb;color:#17233b}.wrap{max-width:850px;margin:30px auto}.card{background:white;padding:20px;border-radius:12px;margin:12px 0}</style><main class="wrap"><a href="/dashboard">Dashboard</a><h1>Notifications</h1>{% for item in items %}<section class="card"><strong>{{ item['title'] }}</strong> {% if not item['is_read'] %}<span>New</span>{% endif %}<p>{{ item['message'] }}</p><small>{{ item['created_at'] }}</small>{% if not item['is_read'] %}<form method="post" action="{{ url_for('read_notification',item_id=item['id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Mark read</button></form>{% endif %}</section>{% else %}<p>No notifications yet.</p>{% endfor %}</main></html>
