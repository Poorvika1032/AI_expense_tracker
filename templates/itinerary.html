<!doctype html><html lang="en" data-theme="{{ session.get('theme', 'light') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rule-based itinerary</title><style>body{font:16px Arial;background:#f3f6fb;color:#17233b}.wrap{max-width:800px;margin:30px auto}.card{background:white;padding:22px;border-radius:12px;margin:14px 0}input,button{padding:10px;margin:5px}</style><main class="wrap"><a href="/dashboard">Dashboard</a><h1>Simple itinerary planner</h1><p>This is a rule-based outline, not an AI-generated local guide.</p><section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="destination" required placeholder="Destination"><input name="days" type="number" min="1" max="30" required placeholder="Days"><input name="budget" type="number" min="0" step="0.01" required placeholder="Budget"><button>Create outline</button></form></section>{% if plan %}<section class="card"><h2>{{ plan|length }} day outline</h2><ol>{% for day in plan %}<li>Day {{ day['day'] }}: {{ day['activity'] }} · suggested daily budget ₹{{ day['budget'] }}</li>{% endfor %}</ol></section>{% endif %}</main></html>
